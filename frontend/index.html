<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decentralized Stripe - Payment Widget Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .checkout-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .price-tag {
      font-size: 2rem;
      font-weight: 800;
      color: var(--success);
      margin-bottom: 1.5rem;
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-box {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.05);
      font-size: 0.85rem;
      word-break: break-all;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="checkout-card">
  <div class="title">Decentralized Stripe</div>
  <div class="subtitle">Trustless Web3 Escrow Payment</div>
  
  <div class="price-tag">100.00 USDC</div>

  <div id="widget-container">
    <button class="btn" id="connect-wallet-btn" onclick="connectWallet()">Connect Wallet</button>
    <button class="btn" id="pay-btn" onclick="payWithEscrow()" style="display:none;">Pay with Escrow</button>
    <button class="btn" id="release-btn" onclick="claimOracleRelease()" style="display:none;">Claim Oracle Release</button>
  </div>

  <div class="status-box" id="status-display">Wallet not connected</div>
</div>

<script>
  let provider, signer, userAddress, chainId;
  const BACKEND_URL = "http://localhost:8000";

  // Configurable addresses for checkout parameters
  const CONFIG = {
    escrowAddress: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0",
    usdcAddress: "0x5FbDB2315678afecb367f032d93F642f64180aa3",
    sellerAddress: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8",
    itemPrice: "100000000", // 100 USDC (6 decimals)
    grossAmount: "100100000", // 100 USDC + 0.1% surcharge (100,100,000)
    trackingId: "TRACK123"
  };

  const ERC20_ABI = [
    "function approve(address spender, uint256 amount) public returns (bool)"
  ];

  const ESCROW_ABI = [
    "function deposit(bytes32 orderId, address seller, uint256 itemPrice) external returns (bool)",
    "function releaseWithOracle(bytes32 orderId, uint256 grossAmount, uint256 itemPrice, string carrierId, bytes32 trackingHash, uint256 nonce, uint256 voucherDeadline, bytes[] signatures) external"
  ];

  let currentOrderId = "0x" + Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2, '0')).join('');

  async function connectWallet() {
    try {
      if (!window.ethereum) {
        document.getElementById("status-display").innerText = "MetaMask or EVM provider not detected.";
        return;
      }
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      userAddress = await signer.getAddress();
      const network = await provider.getNetwork();
      chainId = Number(network.chainId);

      document.getElementById("status-display").innerText = `Connected: ${userAddress.substring(0, 6)}...${userAddress.substring(38)} (Chain ID: ${chainId})`;
      document.getElementById("connect-wallet-btn").style.display = "none";
      document.getElementById("pay-btn").style.display = "block";
    } catch (err) {
      document.getElementById("status-display").innerText = `Wallet Connection Error: ${err.message}`;
    }
  }

  async function payWithEscrow() {
    const payBtn = document.getElementById("pay-btn");
    const statusDisplay = document.getElementById("status-display");
    payBtn.disabled = true;

    try {
      statusDisplay.innerText = "1/3 Registering checkout session with backend...";

      const sessionReq = {
        order_id: currentOrderId,
        buyer: userAddress,
        seller: CONFIG.sellerAddress,
        item_price: parseInt(CONFIG.itemPrice),
        gross_amount: parseInt(CONFIG.grossAmount),
        token: CONFIG.usdcAddress,
        contract_address: CONFIG.escrowAddress,
        chain_id: chainId,
        tracking_id: CONFIG.trackingId
      };

      const res = await fetch(`${BACKEND_URL}/api/v1/checkout/session`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sessionReq)
      });

      if (!res.ok) {
        const errData = await res.json();
        throw new Error(errData.detail || "Backend session creation failed");
      }

      statusDisplay.innerText = "2/3 Approving USDC spending...";
      const usdcContract = new ethers.Contract(CONFIG.usdcAddress, ERC20_ABI, signer);
      const approveTx = await usdcContract.approve(CONFIG.escrowAddress, CONFIG.grossAmount);
      await approveTx.wait();

      statusDisplay.innerText = "3/3 Depositing payment into Escrow contract...";
      const escrowContract = new ethers.Contract(CONFIG.escrowAddress, ESCROW_ABI, signer);
      const depositTx = await escrowContract.deposit(currentOrderId, CONFIG.sellerAddress, CONFIG.itemPrice);
      await depositTx.wait();

      statusDisplay.innerText = "Payment Deposited in Escrow! Ready for delivery release.";
      payBtn.style.display = "none";
      document.getElementById("release-btn").style.display = "block";
    } catch (err) {
      statusDisplay.innerText = `Escrow Deposit Error: ${err.message}`;
      payBtn.disabled = false;
    }
  }

  async function claimOracleRelease() {
    const releaseBtn = document.getElementById("release-btn");
    const statusDisplay = document.getElementById("status-display");
    releaseBtn.disabled = true;

    try {
      statusDisplay.innerText = "1/2 Querying oracle threshold vouchers...";

      const res = await fetch(`${BACKEND_URL}/api/v1/order/${currentOrderId}/attestation`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ buyer: userAddress })
      });

      if (!res.ok) {
        const errData = await res.json();
        throw new Error(errData.detail || "Attestation query failed");
      }

      const data = await res.json();
      if (data.status !== "success" || !data.order || !data.order.signatures) {
        throw new Error("Delivery not verified yet or threshold attestation pending.");
      }

      const orderData = data.order;
      const signatures = orderData.signatures;
      const nonce = orderData.nonce;
      const voucherDeadline = orderData.voucher_deadline;

      statusDisplay.innerText = "2/2 Executing releaseWithOracle transaction on-chain...";
      const escrowContract = new ethers.Contract(CONFIG.escrowAddress, ESCROW_ABI, signer);
      const trackingHash = ethers.solidityPackedKeccak256(["string", "string"], ["UPS", CONFIG.trackingId]);

      const releaseTx = await escrowContract.releaseWithOracle(
        currentOrderId,
        CONFIG.grossAmount,
        CONFIG.itemPrice,
        "UPS",
        trackingHash,
        nonce,
        voucherDeadline,
        signatures
      );
      await releaseTx.wait();

      statusDisplay.innerText = "Order Settled Successfully! Funds released to seller & fee recipient.";
      releaseBtn.style.display = "none";
    } catch (err) {
      statusDisplay.innerText = `Release Error: ${err.message}`;
      releaseBtn.disabled = false;
    }
  }
</script>

</body>
</html>
